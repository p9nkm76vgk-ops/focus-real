<script>
const P=(()=>{                                                                                       

const hm = (h        , m = 0) => h * 60 + m;
const wk        = [{ start: hm(15, 30), end: hm(20, 30) }, { start: hm(21, 15), end: hm(22) }];
const we        = [{ start: hm(10), end: hm(13, 30) }, { start: hm(16), end: hm(20, 30) }, { start: hm(21, 15), end: hm(22) }];
/** Valores iniciales editables. Lun/Mar descuentan llegada a casa (16:30 / 17:10) y cena. */
const DEFAULT_SETTINGS           = {
  availability: { 0: we, 1: [{ start: hm(17), end: hm(20, 30) }, { start: hm(21, 15), end: hm(22) }],
    2: [{ start: hm(17, 40), end: hm(20, 30) }, { start: hm(21, 15), end: hm(22) }], 3: wk, 4: wk, 5: wk, 6: we },
  blockedDates: [], maxDayMin: 240, preferredMin: 50, maxSessionMin: 90, minSessionMin: 25, minGapMin: 10, horizonDays: 28,
};
/** Función de prioridad: desempate entre demandas con el mismo plazo. Ajustable. */
const PRIORITY_WEIGHTS = { importance: 2, difficulty: 1, exam: 3, unreadiness: 2, urgency: 10 };
const REVIEW_SHARE = 0.25;   // parte del trabajo de un examen reservada a repaso final
const REVIEW_DAYS = 2;       // el repaso ocupa los últimos N días antes del examen
const EXAM_BUFFER_MIN = 60;  // margen antes de la hora del examen el mismo día

const addDays = (d        , n        ) => { const t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };

    }
    out = next;
  }
  return out.filter(w => w.end > w.start).sort((a, b) => a.start - b.start);
}

                                                                                                                                                                         
                                                                         

/** Planificador determinista e idempotente. Función pura: (estado, ahora) → nuevo estado. */
function plan(input                                                                                                                                                   , now     )             {
  const s = input.settings;
  const active = (w       ) => !!w && (w.status === 'pending' || w.status === 'in_progress');

  const days = new Map             ();
  const day = (d        ) => { let x = days.get(d); if (!x) { x = { occ: [], total: 0, perWork: new Map() }; days.set(d, x); } return x; };
  const occupy = (b       ) => { const x = day(b.date); x.occ.push({ start: b.start, end: b.end }); x.total += dur(b); x.perWork.set(b.workId, (x.perWork.get(b.workId) ?? 0) + dur(b)); };
  history.filter(b => b.status === 'done').forEach(occupy);
  manualF.forEach(occupy);
  // Ejercicio y actividades con hora: tiempo OCUPADO (no cuenta para el tope diario de estudio). El estudio automático se coloca alrededor; nunca se mueve a la fuerza.
  for (const a of input.activities ?? []) if (a.status !== 'skipped' && a.start != null && a.end != null) day(a.date).occ.push({ start: a.start, end: a.end });
  const free = (date        , clip         ) => {
    const cuts        = [...s.blockedDates.filter(b => b.date === date), ...day(date).occ.map(o => ({ start: o.start - s.minGapMin, end: o.end + s.minGapMin }))];
    if (clip && date === now.date) cuts.push({ start: 0, end: up5(now.minute) });
    return subtract(s.availability[weekday(date)] ?? [], cuts);
  };

  // 1) Demandas por trabajo activo
  const warnings            = [], demands           = [];
  const horizonEnd = addDays(now.date, s.horizonDays);
  for (const w of input.works.filter(active)) {
    const done = w.estimate ? 0 /* el estimador ya descuenta el progreso */ : history.filter(b => b.workId === w.id && b.status === 'done').reduce((a, b) => a + (b.actualMin ?? dur(b)), 0);

  // 2) Conservar sesiones automáticas aún válidas (evita cambios innecesarios)

  const kept          = [], created          = [], rem = new Map                ();

    let have = 0;
    for (const b of autoF.filter(x => x.workId === d.w.id && (x.part ?? 'main') === d.part).sort(cmp)) {

      occupy(b); kept.push(b); have += dur(b);
    }
    rem.set(d, d.need - have);
  }

  // 3) Cubrir lo que falta: sesiones repartidas por los días menos cargados
  const fill = (d        , to        , left        )         => {
    while (left > 0) {
      let len = Math.min(s.preferredMin, left);
      if (left - len > 0 && left - len < s.minSessionMin) len = Math.min(left, s.maxSessionMin);
      const cands                                                                            = [];

        const x = day(dt), capLeft = s.maxDayMin - x.total; if (capLeft <= 0) continue;
        for (const f of free(dt, true)) {
          const st = up5(f.start), end = Math.min(f.end, dt === d.last ? d.cutoff : 1440);

        }
      }
      if (!cands.length) break;
      cands.sort((a, b) => a.key[0] - b.key[0] || a.key[1] - b.key[1] || a.key[2].localeCompare(b.key[2]));

      let id = `auto:${d.w.id}:${d.part}:${c.dt}:${c.start}`, k = 1; while (used.has(id)) id = `auto:${d.w.id}:${d.part}:${c.dt}:${c.start}:r${k++}`; used.add(id);

    }
    return left;
  };
  const deficit = new Map                (), clippedW = new Set        ();
  for (const d of demands) {
    let left = fill(d, d.to, rem.get(d) );
    if (left > 0 && d.ext && d.ext > d.to) left = fill(d, d.ext, left);
    if (left > 0 && !d.clipped) deficit.set(d.w.id, (deficit.get(d.w.id) ?? 0) + left);
    if (d.clipped) clippedW.add(d.w.id);
  }

  // 4) Cerrar sesiones incumplidas y ensamblar
  const future = [...manualF, ...kept, ...created];
  const hasFuture = (id        ) => future.some(b => b.workId === id) && active(byId.get(id));
  const closed = missed.map(b => ({ ...b, status: (hasFuture(b.workId) ? 'rescheduled' : 'skipped')                    }));
  const keepIds = new Set(kept.map(b => b.id));
  const removed = autoF.filter(b => !keepIds.has(b.id)).map(b => b.id);
  return { blocks: [...history, ...closed, ...future].sort(cmp), created: created.map(b => b.id), removed, statusChanged: closed.map(b => b.id), warnings };
}

/** Capacidad real hasta la fecha límite (misma disponibilidad que el planificador): minutos libres y días distintos con hueco útil.
 *  Excluye las sesiones automáticas pendientes del propio trabajo (se regenerarían); cuenta lo demás como ocupado. */
function capacityFor(s          , blocks         , now     , w      , acts                                                                               = [])                                        {
  const hz = addDays(now.date, s.horizonDays), last = w.dueDate < now.date ? now.date : w.dueDate > hz ? hz : w.dueDate;
  const cutoff = w.kind === 'exam' ? (w.dueMinute ?? hm(9)) - EXAM_BUFFER_MIN : (w.dueMinute ?? 1440);

  for (let d = now.date; d <= last; d = addDays(d, 1)) {
    const occ = blocks.filter(b => b.date === d && (b.workId === w.id ? b.status === 'done' || (b.status === 'planned' && b.manual) : b.status === 'planned' || b.status === 'done'));
    const cuts        = [...s.blockedDates.filter(b => b.date === d), ...occ.map(o => ({ start: o.start - s.minGapMin, end: o.end + s.minGapMin })), ...acts.filter(a => a.date === d && a.status !== 'skipped' && a.start != null && a.end != null).map(a => ({ start: a.start  - s.minGapMin, end: a.end  + s.minGapMin }))];

}

const EST2=(()=>{/** Registro de parámetros del estimador 2.0. FASE 1: solo declaración; el estimador v1 no los usa.
 *  Etiquetas: EVIDENCIA-ESTRUCTURA (la estructura está respaldada, el valor no) · HEURÍSTICO-PREVIO (valor inicial sin respaldo,
 *  se sustituye por tus datos) · APRENDIDO (se estima de tus datos) · UMBRAL-CONFIGURABLE (decisión de producto, editable). */
                                                                                                          
                                  
                                                                                                                                                    
                                                                                                                  
                                                                                                             
                                                  
                                                 
                                                                                                                 
                                                                                                          
                                                                                                    
                                                                                          
                                                                                                                   
                                                        
                                                                                                                            
 
const DEFAULT_ESTIMATOR_CONFIG                  = {
  calibrationMinErrors: 10, coverageTolerance: 0.1, evidenceItemsLow: 3, evidenceItemsMedium: 8, evidenceItemsHigh: 15,
  selfRatingPseudoItems: 2, speedPriorStrength: 3, forgettingDays: 30, sanityMaxExamMin: 6000, minSpacingDays: 3, minValidSessionMin: 5,
  targetIndependentSuccess: { aprobar: 0.6, notable: 0.75, excelente: 0.9 },

  calibrationMinErrors: 'UMBRAL-CONFIGURABLE', coverageTolerance: 'UMBRAL-CONFIGURABLE', evidenceItemsLow: 'UMBRAL-CONFIGURABLE', evidenceItemsMedium: 'UMBRAL-CONFIGURABLE',
  evidenceItemsHigh: 'UMBRAL-CONFIGURABLE', selfRatingPseudoItems: 'HEURISTICO-PREVIO', speedPriorStrength: 'HEURISTICO-PREVIO', forgettingDays: 'HEURISTICO-PREVIO',
  sanityMaxExamMin: 'UMBRAL-CONFIGURABLE', minSpacingDays: 'HEURISTICO-PREVIO', minValidSessionMin: 'UMBRAL-CONFIGURABLE', targetIndependentSuccess: 'UMBRAL-CONFIGURABLE',
};
/** Unidades prácticas por familia de asignatura. La extensión puede ser DESCONOCIDA (count null): no se inventa. */

function subForm(id){const s=id?S.subjects.find(x=>x.id===id)||{}:{};openForm(id?'Editar asignatura':'Nueva asignatura',[{k:'name',l:'Nombre',v:s.name||''},{k:'family',l:'Tipo de asignatura (define las unidades; no se comparan entre tipos)',t:'select',o:FAM,v:s.family||'generico'},{k:'color',l:'Color (único por asignatura)',t:'color',v:id?effectiveColor(s):nextSpare(S.subjects.map(effectiveColor))},...(id?[{k:'archived',l:'Estado',t:'select',o:[['0','Activa'],['1','Archivada']],v:s.archived?'1':'0'}]:[])],v=>{if(!v.name.trim())return'El nombre es obligatorio.';if(colorConflict(S.subjects,id,v.color))return'Ese color ya lo usa otra asignatura.';const ck=s.colorKey??(v.name.trim() in DEFAULT_SUBJECT_COLORS?v.name.trim():undefined);const o={...s,id:s.id||uid(),name:v.name.trim(),color:v.color,colorKey:ck,userColor:ck&&v.color.toLowerCase()!==DEFAULT_SUBJECT_COLORS[ck].toLowerCase()?v.color:undefined,family:v.family||'generico',archived:v.archived==='1'};S.subjects=id?S.subjects.map(x=>x.id===id?o:x):[...S.subjects,o];commit()},id&&(()=>{if(S.works.some(w=>w.subjectId===id))return'Tiene tareas o exámenes: archívala en su lugar.';S.subjects=S.subjects.filter(x=>x.id!==id);commit()}))}

 const e=validate(o);if(e){toast('Copia no válida: '+e);return e}
 if(!confirm(`Importar copia: ${o.subjects.length} asignaturas, ${o.works.length} tareas/exámenes, ${o.blocks.length} sesiones.\nSe guardará una copia automática de tus datos actuales y después se reemplazarán. ¿Continuar?`))return'cancelado';
 const cur=localStorage.getItem(KEY);if(cur)localStorage.setItem(BAK,cur);
