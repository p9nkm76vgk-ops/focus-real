<script>
const P=(()=>{                                                                                       

const hm = (h        , m = 0) => h * 60 + m;

const we        = [{ start: hm(10), end: hm(13, 30) }, { start: hm(16), end: hm(20, 30) }, { start: hm(21, 15), end: hm(22) }];
/** Valores iniciales editables. Lun/Mar descuentan llegada a casa (16:30 / 17:10) y cena. */
const DEFAULT_SETTINGS           = {
  availability: { 0: we, 1: [{ start: hm(17), end: hm(20, 30) }, { start: hm(21, 15), end: hm(22) }],

/** Función de prioridad: desempate entre demandas con el mismo plazo. Ajustable. */
const PRIORITY_WEIGHTS = { importance: 2, difficulty: 1, exam: 3, unreadiness: 2, urgency: 10 };

const REVIEW_DAYS = 2;       // el repaso ocupa los últimos N días antes del examen

  }

/** Planificador determinista e idempotente. Función pura: (estado, ahora) → nuevo estado. */
function plan(input                                                        , now     )             {

    const cuts        = [...s.blockedDates.filter(b => b.date === date), ...day(date).occ.map(o => ({ start: o.start - s.minGapMin, end: o.end + s.minGapMin }))];
    if (clip && date === now.date) cuts.push({ start: 0, end: up5(now.minute) });

    }

  }

  const fill = (d        , to        , left        )         => {
    while (left > 0) {
      let len = Math.min(s.preferredMin, left);
      if (left - len > 0 && left - len < s.minSessionMin) len = Math.min(left, s.maxSessionMin);

        }

      if (!cands.length) break;
      cands.sort((a, b) => a.key[0] - b.key[0] || a.key[1] - b.key[1] || a.key[2].localeCompare(b.key[2]));

    let left = fill(d, d.to, rem.get(d) );

  }

  const future = [...manualF, ...kept, ...created];
  const hasFuture = (id        ) => future.some(b => b.workId === id) && active(byId.get(id));
  const closed = missed.map(b => ({ ...b, status: (hasFuture(b.workId) ? 'rescheduled' : 'skipped')                    }));

}

/** Capacidad real hasta la fecha límite (misma disponibilidad que el planificador): minutos libres y días distintos con hueco útil.
 *  Excluye las sesiones automáticas pendientes del propio trabajo (se regenerarían); cuenta lo demás como ocupado. */
function capacityFor(s          , blocks         , now     , w      )                                        {
  const hz = addDays(now.date, s.horizonDays), last = w.dueDate < now.date ? now.date : w.dueDate > hz ? hz : w.dueDate;

  let freeMin = 0, freeDays = 0;
  for (let d = now.date; d <= last; d = addDays(d, 1)) {
    const occ = blocks.filter(b => b.date === d && (b.workId === w.id ? b.status === 'done' || (b.status === 'planned' && b.manual) : b.status === 'planned' || b.status === 'done'));

    if (d === now.date) cuts.push({ start: 0, end: up5(now.minute) });

    const free = Math.min(wins.reduce((a, x) => a + dur(x), 0), Math.max(0, s.maxDayMin - occ.reduce((a, o) => a + dur(o), 0)));

  return { freeMin, freeDays };
}
;return{plan,priority,DEFAULT_SETTINGS,addDays,weekday,totalNeed,capacityFor}})();
const EST2=(()=>{/** Registro de parámetros del estimador 2.0. FASE 1: solo declaración; el estimador v1 no los usa.
 *  Etiquetas: EVIDENCIA-ESTRUCTURA (la estructura está respaldada, el valor no) · HEURÍSTICO-PREVIO (valor inicial sin respaldo,
 *  se sustituye por tus datos) · APRENDIDO (se estima de tus datos) · UMBRAL-CONFIGURABLE (decisión de producto, editable). */
                                                                                                          
                                  
                                                                                                                                                    
                                                                                                                  
                                                                                                             
                                                  
                                                 
                                                                                                                 
                                                                                                          
                                                                                                    
                                                                                          
                                                                                                                   
                                                        
                                                                                                                            
 
const DEFAULT_ESTIMATOR_CONFIG                  = {
  calibrationMinErrors: 10, coverageTolerance: 0.1, evidenceItemsLow: 3, evidenceItemsMedium: 8, evidenceItemsHigh: 15,
  selfRatingPseudoItems: 2, speedPriorStrength: 3, forgettingDays: 30, sanityMaxExamMin: 6000, minSpacingDays: 3, minValidSessionMin: 5,
  targetIndependentSuccess: { aprobar: 0.6, notable: 0.75, excelente: 0.9 },
};
const PARAM_TAGS                                          = {
  calibrationMinErrors: 'UMBRAL-CONFIGURABLE', coverageTolerance: 'UMBRAL-CONFIGURABLE', evidenceItemsLow: 'UMBRAL-CONFIGURABLE', evidenceItemsMedium: 'UMBRAL-CONFIGURABLE',
  evidenceItemsHigh: 'UMBRAL-CONFIGURABLE', selfRatingPseudoItems: 'HEURISTICO-PREVIO', speedPriorStrength: 'HEURISTICO-PREVIO', forgettingDays: 'HEURISTICO-PREVIO',
  sanityMaxExamMin: 'UMBRAL-CONFIGURABLE', minSpacingDays: 'HEURISTICO-PREVIO', minValidSessionMin: 'UMBRAL-CONFIGURABLE', targetIndependentSuccess: 'UMBRAL-CONFIGURABLE',
};
/** Unidades prácticas por familia de asignatura. La extensión puede ser DESCONOCIDA (count null): no se inventa. */
const UNIT_PROFILES                                                                       = {
  problemas: { label: 'Problemas y cálculo (Matemáticas, Física, Química)', units: ['tipo de problema', 'apartado del temario', 'página'], itemKind: 'problema resuelto sin ayuda' },
  conceptos: { label: 'Conceptos y desarrollo (Historia, Filosofía, Business)', units: ['apartado', 'concepto o autor', 'página'], itemKind: 'pregunta respondida de memoria' },
  produccion: { label: 'Producción y lengua (Lengua, Catalán, Inglés)', units: ['texto u obra', 'apartado de gramática o léxico', 'página'], itemKind: 'ejercicio o escrito sin ayuda' },
  generico: { label: 'Otra asignatura', units: ['apartado', 'página'], itemKind: 'ítem resuelto sin ayuda' },
};
;/** ESTIMADOR 2.0. Estructura respaldada por la literatura (recuperación sin apuntes, repaso espaciado, ejemplos resueltos para novatos);
 *  TODOS los valores numéricos de V2 son HEURISTICO-PREVIO (valores iniciales sin respaldo empírico) y se sustituyen por datos del usuario.
 *  El dominio es una estimación probabilística (Beta con prior débil), NO una medición objetiva. Sin dependencias. */
                                                                                                                             


const V2 = {

  speed: { aprendizaje: 25, practica: 30, recuperacion: 12, errores: 15, repaso: 8 }                         , // min/unidad (previo)

const PH          = ['aprendizaje', 'practica', 'recuperacion', 'errores', 'repaso'];
const clamp = (x        , a        , b        ) => Math.min(b, Math.max(a, x));
const median = (a          ) => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const LV                  = ['ninguna', 'baja', 'media', 'alta'];
const days = (a        , b        ) => Math.max(0, (Date.parse(b) - Date.parse(a)) / 864e5);

/** Dominio: Beta(α,β). Prior débil desde el autoinforme (selfRatingPseudoItems ítems); solo los aciertos INDEPENDIENTES cuentan como éxito;
 *  con ayuda y omitidos cuentan como medio fallo; la evidencia antigua pesa menos (olvido exponencial). */
function masteryOf(t       , cfg = DEFAULT_ESTIMATOR_CONFIG, now         ) {
  const r = 0.15 + 0.7 * clamp(t.selfRating ?? t.mastery ?? 0, 0, 3) / 3, n0 = cfg.selfRatingPseudoItems;
  let a = 1 + n0 * r, b = 1 + n0 * (1 - r), items = 0;

    const w = now ? Math.exp(-days(x.at, now) / cfg.forgettingDays) : 1;

}
/** Velocidad por fase (min/unidad): mediana de sesiones VÁLIDAS con unidades y fase, recortadas, contraídas hacia el previo (n0). Sin unidades = solo tiempo. */
function learnSpeeds(blocks         , cfg = DEFAULT_ESTIMATOR_CONFIG) {
