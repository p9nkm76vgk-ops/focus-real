<script>
const P=(()=>{                                                                                       

const hm = (h        , m = 0) => h * 60 + m;
const wk        = [{ start: hm(15, 30), end: hm(20, 30) }, { start: hm(21, 15), end: hm(22) }];
const we        = [{ start: hm(10), end: hm(13, 30) }, { start: hm(16), end: hm(20, 30) }, { start: hm(21, 15), end: hm(22) }];
/** Valores iniciales editables. Lun/Mar descuentan llegada a casa (16:30 / 17:10) y cena. */
const DEFAULT_SETTINGS           = {
  availability: { 0: we, 1: [{ start: hm(17), end: hm(20, 30) }, { start: hm(21, 15), end: hm(22) }],
    2: [{ start: hm(17, 40), end: hm(20, 30) }, { start: hm(21, 15), end: hm(22) }], 3: wk, 4: wk, 5: wk, 6: we },
  blockedDates: [], maxDayMin: 240, preferredMin: 50, maxSessionMin: 90, minSessionMin: 25, minGapMin: 10, horizonDays: 28,
};
/** Función de prioridad: desempate entre demandas con el mismo plazo. Ajustable. */
const PRIORITY_WEIGHTS = { importance: 2, difficulty: 1, exam: 3, unreadiness: 2, urgency: 10 };
const REVIEW_SHARE = 0.25;   // parte del trabajo de un examen reservada a repaso final
const REVIEW_DAYS = 2;       // el repaso ocupa los últimos N días antes del examen
const EXAM_BUFFER_MIN = 60;  // margen antes de la hora del examen el mismo día

const addDays = (d        , n        ) => { const t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
const weekday = (d        ) => new Date(d + 'T00:00:00Z').getUTCDay();
const daysBetween = (a        , b        ) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5);
const dur = (b                                ) => b.end - b.start;
const up5 = (m        ) => Math.ceil(m / 5) * 5;
const cmp = (a       , b       ) => a.date.localeCompare(b.date) || a.start - b.start || a.id.localeCompare(b.id);

function priority(w      , now     )         {
  const P = PRIORITY_WEIGHTS; const left = Math.max(0, daysBetween(now.date, w.dueDate));
  return w.importance * P.importance + w.difficulty * P.difficulty + (w.kind === 'exam' ? P.exam + (100 - w.readiness) / 100 * P.unreadiness : 0) + P.urgency / (left + 1);
}
/** Minutos totales a trabajar. Examen: la preparación actual reduce hasta un 50 % la estimación. */
const totalNeed = (w      ) => w.estimate ? w.estimate.remainingMin : w.kind === 'exam' ? Math.round(w.estMin * (1 - 0.5 * w.readiness / 100)) : w.estMin;

function subtract(wins       , cuts       )        {
  let out = wins.map(w => ({ ...w }));
  for (const c of cuts) {
    const next        = [];
    for (const w of out) {
      if (c.end <= w.start || c.start >= w.end) { next.push(w); continue; }
      if (c.start > w.start) next.push({ start: w.start, end: c.start });
      if (c.end < w.end) next.push({ start: c.end, end: w.end });
    }
    out = next;
  }
  return out.filter(w => w.end > w.start).sort((a, b) => a.start - b.start);
}

                                                                                                                                                                         
                                                                         

/** Planificador determinista e idempotente. Función pura: (estado, ahora) → nuevo estado. */
function plan(input                                                        , now     )             {
  const s = input.settings;
  const active = (w       ) => !!w && (w.status === 'pending' || w.status === 'in_progress');
  const byId = new Map(input.works.map(w => [w.id, w]));
  const isPast = (b       ) => b.date < now.date || (b.date === now.date && b.end <= now.minute);

  const history          = [], manualF          = [], autoF          = [], missed          = [];
  for (const b of input.blocks) {
    if (b.status !== 'planned') history.push(b);
    else if (isPast(b)) missed.push({ ...b });
    else if (b.manual) manualF.push(b); else autoF.push(b);
  }
  const days = new Map             ();
  const day = (d        ) => { let x = days.get(d); if (!x) { x = { occ: [], total: 0, perWork: new Map() }; days.set(d, x); } return x; };
  const occupy = (b       ) => { const x = day(b.date); x.occ.push({ start: b.start, end: b.end }); x.total += dur(b); x.perWork.set(b.workId, (x.perWork.get(b.workId) ?? 0) + dur(b)); };
  history.filter(b => b.status === 'done').forEach(occupy);
  manualF.forEach(occupy);
  const free = (date        , clip         ) => {
    const cuts        = [...s.blockedDates.filter(b => b.date === date), ...day(date).occ.map(o => ({ start: o.start - s.minGapMin, end: o.end + s.minGapMin }))];
    if (clip && date === now.date) cuts.push({ start: 0, end: up5(now.minute) });
    return subtract(s.availability[weekday(date)] ?? [], cuts);
  };

  // 1) Demandas por trabajo activo
  const warnings            = [], demands           = [];
  const horizonEnd = addDays(now.date, s.horizonDays);
  for (const w of input.works.filter(active)) {
    const done = w.estimate ? 0 /* el estimador ya descuenta el progreso */ : history.filter(b => b.workId === w.id && b.status === 'done').reduce((a, b) => a + (b.actualMin ?? dur(b)), 0);
    const manual = manualF.filter(b => b.workId === w.id).reduce((a, b) => a + dur(b), 0);
    const need = Math.max(0, totalNeed(w) - done - manual);
    const overdue = w.dueDate < now.date || (w.dueDate === now.date && w.dueMinute !== undefined && w.dueMinute <= now.minute);
    if (overdue) warnings.push({ workId: w.id, type: 'overdue', message: `"${w.title}" está atrasada (${w.dueDate}).` });
    let last = overdue ? now.date : w.dueDate; const clipped = last > horizonEnd; if (clipped) last = horizonEnd;
    const cutoff = overdue || clipped ? 1440 : w.kind === 'exam' ? (w.dueMinute ?? hm(9)) - EXAM_BUFFER_MIN : (w.dueMinute ?? 1440);
    const base = { w, from: now.date, last, cutoff, prio: priority(w, now), clipped };
    const mainTo = addDays(w.dueDate, -(REVIEW_DAYS + 1));
    if (w.kind === 'exam' && !overdue && !clipped && need > 0 && mainTo >= now.date) {
      const review = Math.min(need, Math.round(need * REVIEW_SHARE / 5) * 5);
      demands.push({ ...base, part: 'main', need: need - review, to: mainTo, ext: last });
      demands.push({ ...base, part: 'review', need: review, from: addDays(w.dueDate, -REVIEW_DAYS) > now.date ? addDays(w.dueDate, -REVIEW_DAYS) : now.date, to: last });
    } else demands.push({ ...base, part: 'main', need, to: last });
  }
  demands.sort((a, b) => a.last.localeCompare(b.last) || b.prio - a.prio || a.w.id.localeCompare(b.w.id) || a.part.localeCompare(b.part));

  // 2) Conservar sesiones automáticas aún válidas (evita cambios innecesarios)
  const used = new Set(input.blocks.map(b => b.id));
  const kept          = [], created          = [], rem = new Map                ();
  for (const d of demands) {
    let have = 0;
    for (const b of autoF.filter(x => x.workId === d.w.id && (x.part ?? 'main') === d.part).sort(cmp)) {
      if (b.date < d.from || b.date > (d.ext ?? d.to) || (b.date === d.last && b.end > d.cutoff) || have + dur(b) > d.need) continue;
      if (!free(b.date, false).some(f => f.start <= b.start && b.end <= f.end) || day(b.date).total + dur(b) > s.maxDayMin) continue;
      occupy(b); kept.push(b); have += dur(b);
    }
    rem.set(d, d.need - have);
  }

  // 3) Cubrir lo que falta: sesiones repartidas por los días menos cargados
  const fill = (d        , to        , left        )         => {
    while (left > 0) {
      let len = Math.min(s.preferredMin, left);
      if (left - len > 0 && left - len < s.minSessionMin) len = Math.min(left, s.maxSessionMin);
      const cands                                                                            = [];
      for (let dt = d.from; dt <= to; dt = addDays(dt, 1)) {
        const x = day(dt), capLeft = s.maxDayMin - x.total; if (capLeft <= 0) continue;
        for (const f of free(dt, true)) {
          const st = up5(f.start), end = Math.min(f.end, dt === d.last ? d.cutoff : 1440);
          const L = Math.min(len, end - st, capLeft, s.maxSessionMin);
          if (L >= Math.min(s.minSessionMin, left)) { cands.push({ dt, start: st, L, key: [x.perWork.get(d.w.id) ? 1 : 0, x.total, dt] }); break; }
        }
      }
      if (!cands.length) break;
      cands.sort((a, b) => a.key[0] - b.key[0] || a.key[1] - b.key[1] || a.key[2].localeCompare(b.key[2]));
      const c = cands[0];
      let id = `auto:${d.w.id}:${d.part}:${c.dt}:${c.start}`, k = 1; while (used.has(id)) id = `auto:${d.w.id}:${d.part}:${c.dt}:${c.start}:r${k++}`; used.add(id);
      const b        = { id, workId: d.w.id, date: c.dt, start: c.start, end: c.start + c.L, status: 'planned', manual: false, part: d.part };
      occupy(b); created.push(b); left -= c.L;
    }
    return left;
  };
  const deficit = new Map                (), clippedW = new Set        ();
  for (const d of demands) {
    let left = fill(d, d.to, rem.get(d) );
    if (left > 0 && d.ext && d.ext > d.to) left = fill(d, d.ext, left);
    if (left > 0 && !d.clipped) deficit.set(d.w.id, (deficit.get(d.w.id) ?? 0) + left);
    if (d.clipped) clippedW.add(d.w.id);
  }
  for (const [id, min] of deficit) { const w = byId.get(id) ; warnings.push({ workId: id, type: 'deficit', deficitMin: min, message: `No caben ${min} min de "${w.title}" antes del ${w.dueDate}. Amplía disponibilidad, reduce la estimación o mueve la fecha.` }); }

  // 4) Cerrar sesiones incumplidas y ensamblar
  const future = [...manualF, ...kept, ...created];
  const hasFuture = (id        ) => future.some(b => b.workId === id) && active(byId.get(id));
  const closed = missed.map(b => ({ ...b, status: (hasFuture(b.workId) ? 'rescheduled' : 'skipped')                    }));
  const keepIds = new Set(kept.map(b => b.id));
  const removed = autoF.filter(b => !keepIds.has(b.id)).map(b => b.id);
  return { blocks: [...history, ...closed, ...future].sort(cmp), created: created.map(b => b.id), removed, statusChanged: closed.map(b => b.id), warnings };
}
;return{plan,priority,DEFAULT_SETTINGS,addDays,weekday,totalNeed}})();
const EST=(()=>{                                                                                        

/** Parámetros explícitos y ajustables. Son reglas orientativas, NO un modelo científico. */
const PARAMS = {
  baseMin: 35,   // min de un tema de cantidad 1, dificultad media, desde cero
  taskBase: 25,  // min por unidad de cantidad en una tarea
  diff: { 1: 0.7, 2: 0.85, 3: 1, 4: 1.2, 5: 1.4 }                          ,
  type: { comprension: 1, memorizacion: 1.1, ejercicios: 1.15, problemas: 1.3, comentario: 1.2, practica: 1.1, mixto: 1.1 }                         ,
  goal: { aprobar: 0.8, notable: 1, excelente: 1.25 }                        ,
  mastery: [1, 0.6, 0.3, 0.12],  // fracción del trabajo que queda en 0,1,2,3 (interpolada)
  split: { comprension: [0.7, 0.3], memorizacion: [0.6, 0.4], ejercicios: [0.3, 0.7], problemas: [0.35, 0.65], comentario: [0.4, 0.6], practica: [0.2, 0.8], mixto: [0.5, 0.5] }                                   , // [aprendizaje, práctica]
  review: 0.15,                  // repaso: UNA sola vez, sobre (aprendizaje+práctica)
  multClamp: [0.6, 1.8], topicClamp: [5, 300], examClamp: [20, 3000], taskClamp: [10, 600],
  rangeInitial: 0.3, rangePersonal: 0.15, rangeProvisional: 0.1,
  calClamp: [0.6, 1.6], window: 20, minValidMin: 5, maxOverrun: 3, minProgress: 0.2,
};
const clamp = (x        , a        , b        ) => Math.min(b, Math.max(a, x));
const pct = (x        ) => `${x >= 0 ? '+' : '−'}${Math.abs(Math.round(x * 100))}%`;
const fracMastery = (m        ) => { const t = PARAMS.mastery, x = clamp(m, 0, 3), i = Math.min(2, Math.floor(x)); return t[i] + (t[i + 1] - t[i]) * (x - i); };
const mult = (d        , k       , g      ) => clamp((PARAMS.diff[Math.round(d)] ?? 1) * PARAMS.type[k] * PARAMS.goal[g], PARAMS.multClamp[0], PARAMS.multClamp[1]);

// ---------- Aprendizaje personal: medianas robustas ----------
                                                                                            
                                                                   
/** Cociente (tiempo necesario / tiempo previsto). null = registro no fiable (interrumpida, sin avance real, absurda). */
function ratioOf(s        )                {
  const { planned, log } = s;
  if (log.interrupted || !(planned > 0) || !(log.actualMin >= PARAMS.minValidMin) || log.actualMin > planned * PARAMS.maxOverrun + 30) return null;
  const p = log.goalMet ? 1 : clamp(log.progress / 100, 0, 1);
  if (p < PARAMS.minProgress) return null;
  return clamp(log.actualMin / p / planned, 0.5, 2);
}
const median = (a          ) => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
/** Nivel más específico con datos suficientes (tipo≥5, asignatura≥5, global≥3); el ajuste crece gradualmente con n. */
function calibrate(samples          , subjectId        , kind       )        {
  const pick = (f                        ) => samples.filter(f).map(ratioOf).filter((r)              => r !== null).slice(-PARAMS.window);
  const levels                               = [['tipo', pick(s => s.subjectId === subjectId && s.kind === kind), 5], ['asignatura', pick(s => s.subjectId === subjectId), 5], ['global', pick(() => true), 3]];
  for (const [level, r, min] of levels) if (r.length >= min) {
    const w = Math.min(1, (r.length - 2) / 8);
    return { factor: clamp(1 + (median(r) - 1) * w, PARAMS.calClamp[0], PARAMS.calClamp[1]), n: r.length, level };
  }
  return { factor: 1, n: 0, level: 'ninguno' };
}
const NOCAL        = { factor: 1, n: 0, level: 'ninguno' };

function build(a                                                                                                                                                                                                       )           {
  const raw = (a.L + a.Pr + a.R) * a.cal.factor;
  const rem = a.manualMin != null ? Math.max(0, a.manualMin - a.invested) : Math.max(0, raw - a.unattributed);
  const s = raw > 0 ? rem / (raw) : 0, f = a.cal.factor * s;
  const range = (a.cal.level !== 'ninguno' ? PARAMS.rangePersonal : PARAMS.rangeInitial) + (a.provisional ? PARAMS.rangeProvisional : 0);
  const factors = [...a.factors];
  if (a.manualMin != null) factors.push('Corregida manualmente por ti (total fijado; no cuenta como tiempo estudiado)');
  factors.push(a.cal.level === 'ninguno' ? 'Estimación inicial: aún no hay historial suficiente' : `Ajustada a tu historial (${a.cal.level}, ${a.cal.n} sesiones válidas): ${pct(a.cal.factor - 1)}`);
  const R = (x        ) => Math.round(x);
  return { totalMin: R(a.invested + rem), investedMin: R(a.invested), remainingMin: R(rem), lowMin: R(rem * (1 - range)), highMin: R(rem * (1 + range)), learnMin: R(a.L * f), practiceMin: R(a.Pr * f), reviewMin: R(a.R * f),
    perTopic: a.per.map(t => ({ id: t.id, name: t.name, remainingMin: R(t.t * f) })), factors, confidence: a.cal.level === 'ninguno' ? 'inicial' : 'personalizada', provisional: a.provisional, calibration: a.cal };
}

function estimateExam(i                                                                                                                         )           {
  const P = PARAMS; let L = 0, Pr = 0, full = 0, dm = 0, sz = 0; const per                                            = [];
  const [a, b] = P.split[i.kind];
  for (const t of i.topics) {
    const m = mult(t.difficulty, i.kind, i.goal), at0 = clamp(t.size * P.baseMin * m, P.topicClamp[0], P.topicClamp[1]);
    const tt = clamp(t.size * P.baseMin * m * fracMastery(t.mastery), P.topicClamp[0], P.topicClamp[1]);
    L += tt * a; Pr += tt * b; full += at0; per.push({ id: t.id, name: t.name, t: tt * (1 + P.review) }); dm += t.size * (P.diff[Math.round(t.difficulty)] ?? 1); sz += t.size;
  }
  let R = P.review * (L + Pr); const raw = L + Pr + R, c = clamp(raw, P.examClamp[0], P.examClamp[1]) / (raw || 1);
  L *= c; Pr *= c; R *= c; per.forEach(t => t.t *= c);
  const cur = L + Pr, dAvg = dm / (sz || 1), red = 1 - (cur / (c || 1)) / (full || 1);
  const factors = [`${i.topics.length} tema(s), cantidad media ${(sz / (i.topics.length || 1)).toFixed(1)}/5`, `Dificultad ${dAvg > 1.1 ? 'alta' : dAvg < 0.92 ? 'baja' : 'media'} (${pct(dAvg - 1)})`,
    ...(red > 0.02 ? [`Preparación previa: ${pct(-red)} del trabajo`] : []), `Tipo: ${i.kind} (${pct(P.type[i.kind] - 1)}) · objetivo: ${i.goal}`, `Repaso final incluido una vez: ${Math.round(R)} min`];

const wrow=w=>{const s=sub(w.subjectId),[p,c]=prio(w);return`<div class="card item" style="--c:${s.color}" data-a=${w.kind==='exam'?'editExam':'editTask'} data-id="${w.id}">${w.kind==='task'?`<button data-a=toggle data-id="${w.id}" aria-label="Completar">${w.status==='done'?'↺':'✓'}</button>`:''}<span class=dot></span><div><b${w.status==='done'?' style="text-decoration:line-through"':''}>${esc(w.title)}</b><small>${esc(s.name)} · ${w.dueDate}${w.dueMinute!=null?' '+fm(w.dueMinute):''} · ${hr(w.estMin)}${w.kind==='exam'?' · prep. '+w.readiness+'%':''}</small>${estLine(w)}</div>${w.status==='pending'||w.status==='in_progress'?`<span class="tag ${c}">${p}</span>`:`<em>${STS.find(x=>x[0]===w.status)[1]}</em>`}</div>`};
const V={};
V.hoy=()=>{const n=now(),tb=S.blocks.filter(b=>b.date===n.date&&b.status!=='rescheduled').sort((a,b)=>a.start-b.start),st=stats(tb,S.works,n),mon=addDays(n.date,-((weekday(n.date)+6)%7)),sw=stats(S.blocks.filter(b=>b.date>=mon&&b.date<=addDays(mon,6)),S.works,n);
 const ex=act().filter(w=>w.kind==='exam'&&w.dueDate>=n.date).sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).slice(0,3),od=act().filter(w=>w.kind==='task'&&w.dueDate<n.date),top=act().sort((a,b)=>priority(b,n)-priority(a,n)).slice(0,4),nx=S.blocks.filter(b=>b.status==='planned'&&(b.date>n.date)).sort((a,b)=>a.date.localeCompare(b.date)||a.start-b.start).slice(0,3);
 return`<h1>Hoy</h1><p class=m>${DOW[weekday(n.date)]} ${n.date}</p>${W.map(w=>`<div class="card warn">⚠ ${esc(w.message)}</div>`).join('')}<div class=row style="justify-content:flex-start;margin:0 0 14px"><button class=pri data-a=addTask>+ Tarea</button><button class=pri data-a=addExam>+ Examen</button><button data-a=addBlk>+ Sesión</button></div>
 <div class=grid><div class=card><h3>Hoy</h3><b>${hr(st.completedMin)}</b> completados de <b>${hr(st.plannedMin)}</b> planificados<div class=bar><i style="width:${st.plannedMin?Math.min(100,100*st.completedMin/st.plannedMin):0}%"></i></div></div><div class=card><h3>Esta semana</h3><b>${hr(sw.completedMin)}</b> de <b>${hr(sw.plannedMin)}</b><div class=bar><i style="width:${sw.plannedMin?Math.min(100,100*sw.completedMin/sw.plannedMin):0}%"></i></div></div></div>
 <h2>Sesiones de hoy</h2>${tb.map(blk).join('')||'<p class=m>Sin sesiones hoy.</p>'}${nx.length?`<h3>Próximas</h3>${nx.map(b=>`<p class=m>${b.date.slice(5)} · ${blk(b).replace(/<button.*?<\/button>/g,'')}</p>`).join('')}`:''}
 <h2>Prioridades</h2>${top.map(wrow).join('')||'<p class=m>Nada pendiente.</p>'}${ex.length?`<h2>Próximos exámenes</h2>${ex.map(wrow).join('')}`:''}${od.length?`<h2>Atrasadas</h2>${od.map(wrow).join('')}`:''}`};
V.tar=()=>{const l=S.works.filter(w=>w.kind==='task').sort((a,b)=>(a.status==='done')-(b.status==='done')||a.dueDate.localeCompare(b.dueDate));return`<h1>Tareas</h1><button class=pri data-a=addTask>+ Nueva tarea</button><br><br>${l.map(wrow).join('')||'<p class=m>Aún no hay tareas.</p>'}`};
V.exa=()=>{const l=S.works.filter(w=>w.kind==='exam').sort((a,b)=>a.dueDate.localeCompare(b.dueDate));return`<h1>Exámenes</h1><button class=pri data-a=addExam>+ Nuevo examen</button><br><br>${l.map(wrow).join('')||'<p class=m>Aún no hay exámenes.</p>'}`};
V.cal=()=>{const n=now();ws=ws||addDays(n.date,-((weekday(n.date)+6)%7));const ds=[...Array(7)].map((_,i)=>addDays(ws,i));
 return`<h1>Calendario</h1><div class=row style="justify-content:flex-start;margin:0 0 12px"><button data-a=wk data-k=-7>←</button><button data-a=wk data-k=0>Hoy</button><button data-a=wk data-k=7>→</button><button data-a=addBlk>+ Sesión</button><button data-a=replan>Regenerar futuro</button></div><div class=wk>${ds.map(d=>`<div><h3>${DOW[weekday(d)]} ${d.slice(8)}${d===n.date?' ●':''}</h3>${S.blocks.filter(b=>b.date===d).sort((a,b)=>a.start-b.start).map(blk).join('')||'<small>—</small>'}</div>`).join('')}</div><p class=m>Los bloques de estudio solo se colocan dentro de la disponibilidad definida en Ajustes. “Mover” convierte una sesión en manual (protegida).</p>`};
V.asg=()=>`<h1>Asignaturas</h1><button class=pri data-a=addSub>+ Asignatura</button><br><br>${S.subjects.map(s=>{const ws_=S.works.filter(w=>w.subjectId===s.id),min=S.blocks.filter(b=>b.status==='done'&&ws_.some(w=>w.id===b.workId)).reduce((a,b)=>a+(b.actualMin??b.end-b.start),0);return`<div class="card item" style="--c:${s.color}" data-a=editSub data-id="${s.id}"><span class=dot></span><div><b>${esc(s.name)}</b><small>${ws_.filter(w=>w.kind==='task').length} tareas · ${ws_.filter(w=>w.kind==='exam').length} exámenes · ${hr(min)} estudiadas</small></div>${s.archived?'<em>Archivada</em>':''}</div>`}).join('')}`;
V.seg=()=>{const n=now(),st=stats(S.blocks,S.works,n),ds=[...Array(7)].map((_,i)=>addDays(n.date,i-6)),mx=Math.max(60,...ds.map(d=>Math.max(st.byDay[d]?.plannedMin||0,st.byDay[d]?.completedMin||0))),sm=Math.max(1,...Object.values(st.bySubject));
 return`<h1>Seguimiento</h1><div class=grid><div class=card><h3>Completado</h3><b>${hr(st.completedMin)}</b></div><div class=card><h3>Planificado</h3><b>${hr(st.plannedMin)}</b></div><div class=card><h3>Cumplimiento</h3><b>${st.compliance==null?'—':st.compliance+'%'}</b></div></div>
 <p class=m>Cumplimiento = minutos de sesiones completadas ÷ minutos de sesiones completadas + omitidas. Las sesiones reprogramadas no se cuentan dos veces. Sesiones: ${st.counts.planned} previstas · ${st.counts.done} hechas · ${st.counts.skipped} omitidas · ${st.counts.rescheduled} reprogramadas.</p>
 <div class=card><h3>Últimos 7 días (hueco = planificado, dorado = completado)</h3><div class=cols>${ds.map(d=>{const x=st.byDay[d]||{plannedMin:0,completedMin:0};return`<div title="${d}"><i class=p style="height:${100*x.plannedMin/mx}%"></i><i style="height:${100*x.completedMin/mx}%"></i></div>`}).join('')}</div><div class=cols style="height:auto;margin-top:4px">${ds.map(d=>`<small style="flex:1;text-align:center">${DOW[weekday(d)]}</small>`).join('')}</div></div>
 <div class=card><h3>Por asignatura (tiempo completado)</h3>${Object.entries(st.bySubject).map(([id,m])=>`<div>${esc(sub(id).name)} · ${hr(m)}<div class=bar><i style="width:${100*m/sm}%;background:${sub(id).color}"></i></div></div>`).join('')||'<p class=m>Aún no has completado sesiones.</p>'}</div>`};
V.aj=()=>{const s=S.settings,N=[['maxDayMin','Máx. estudio al día (min)'],['preferredMin','Duración preferida de sesión (min)'],['maxSessionMin','Duración máxima de sesión (min)'],['minSessionMin','Duración mínima de sesión (min)'],['minGapMin','Descanso mínimo entre sesiones (min)']];
 return`<h1>Ajustes</h1><form id=sf class=card><h3>Disponibilidad semanal</h3><p class=m>Ventanas donde se permite estudiar: HH:MM-HH:MM separadas por comas. Deja fuera clases, trayecto, comidas, descansos y sueño (inicial: levantarse 07:00, acostarse 22:30). Vacío = sin estudio ese día.</p>${[1,2,3,4,5,6,0].map(d=>`<label>${DOW[d]}<input name=d${d} value="${(s.availability[d]||[]).map(w=>fm(w.start)+'-'+fm(w.end)).join(', ')}"></label>`).join('')}<h3>Límites</h3>${N.map(([k,l])=>`<label>${l}<input name=${k} type=number min=0 value=${s[k]}></label>`).join('')}<p class=err id=serr></p><button class=pri>Guardar y replanificar</button></form><div class=card><h3>Datos</h3><p class=m>Almacenamiento provisional: <b>localStorage de este navegador</b> (no es nube ni multiusuario). Safari puede borrar los datos de webs que no abres en 7 días: instala la app en la pantalla de inicio (Compartir → Añadir a pantalla de inicio) y exporta una copia cada semana.</p><div class=row style="justify-content:flex-start"><button data-a=export>Exportar copia JSON</button>${localStorage.getItem(BAK)?'<button data-a=undoImport>Deshacer última importación</button>':''}</div><label>Importar copia JSON (pide confirmación y guarda antes una copia automática)<input type=file id=imp accept=".json,application/json"></label></div>`};
const A={nav:t=>{route=t.dataset.r;render()},close:()=>$('#dlg').close(),addTask:()=>workForm('task'),addExam:()=>workForm('exam'),editTask:t=>workForm('task',t.dataset.id),editExam:t=>workForm('exam',t.dataset.id),
 toggle:t=>{const w=wk(t.dataset.id);w.status=w.status==='done'?'pending':'done';w.updatedAt=Date.now();commit()},doneBlk:t=>logForm(t.dataset.id),addBlk:()=>blkForm(),editBlk:t=>blkForm(t.dataset.id),
 delBlk:t=>{if(confirm('¿Quitar esta sesión manual?')){S.blocks=S.blocks.filter(b=>b.id!==t.dataset.id);commit()}},wk:t=>{ws=t.dataset.k==='0'?null:addDays(ws,+t.dataset.k);render()},replan:()=>{commit();toast('Planificación futura regenerada')},
 addSub:()=>subForm(),editSub:t=>subForm(t.dataset.id),export:()=>dl(JSON.stringify({app:'focus-os',schema:2,exportedAt:new Date().toISOString(),...S},null,1),`focus-os-copia-${now().date}.json`),dlBad:()=>dl(localStorage.getItem(BAD)||'','focus-os-datos-danados.json'),
 fresh:()=>{if(confirm('¿Empezar de cero? La copia dañada se conservará aparte.')){S=fresh();commit()}},
 undoImport:()=>{const raw=localStorage.getItem(BAK);let o=null;try{o=JSON.parse(raw)}catch{}const e=validate(o);if(e)return toast('No hay copia automática válida.');if(!confirm('¿Restaurar los datos anteriores a la última importación?'))return;localStorage.setItem(BAK,JSON.stringify(S));o.version=Math.max(S.version,storedVer());S=o;commit()}};
function subForm(id){const s=id?sub(id):{};openForm(id?'Editar asignatura':'Nueva asignatura',[{k:'name',l:'Nombre',v:s.name||''},{k:'color',l:'Color',t:'color',v:s.color||COL[S.subjects.length%COL.length]},...(id?[{k:'archived',l:'Estado',t:'select',o:[['0','Activa'],['1','Archivada']],v:s.archived?'1':'0'}]:[])],v=>{if(!v.name.trim())return'El nombre es obligatorio.';const o={...s,id:s.id||uid(),name:v.name.trim(),color:v.color,archived:v.archived==='1'};S.subjects=id?S.subjects.map(x=>x.id===id?o:x):[...S.subjects,o];commit()},id&&(()=>{if(S.works.some(w=>w.subjectId===id))return'Tiene tareas o exámenes: archívala en su lugar.';S.subjects=S.subjects.filter(x=>x.id!==id);commit()}))}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a]){e.stopPropagation();A[t.dataset.a](t)}});
document.addEventListener('submit',e=>{if(e.target.id!=='sf')return;e.preventDefault();const v=Object.fromEntries(new FormData(e.target)),av={},er=$('#serr');
 for(let d=0;d<7;d++){const ws_=[];for(const p of(v['d'+d]||'').split(',').map(x=>x.trim()).filter(Boolean)){const m=/^(\d{1,2}:\d{2})-(\d{1,2}:\d{2})$/.exec(p),a=m&&pm(m[1]),b=m&&pm(m[2]);if(!m||a==null||b==null||b<=a||b>1440)return er.textContent=`${DOW[d]}: formato inválido “${p}”.`;ws_.push({start:a,end:b})}ws_.sort((x,y)=>x.start-y.start);if(ws_.some((w,i)=>i&&ws_[i-1].end>w.start))return er.textContent=`${DOW[d]}: ventanas solapadas.`;av[d]=ws_}
 const n={};for(const k of['maxDayMin','preferredMin','maxSessionMin','minSessionMin','minGapMin']){n[k]=+v[k];if(!(n[k]>=0))return er.textContent='Valores numéricos no válidos.'}
 if(n.minSessionMin<5||n.preferredMin<n.minSessionMin||n.maxSessionMin<n.preferredMin)return er.textContent='Debe cumplirse: 5 ≤ mínima ≤ preferida ≤ máxima.';
 S.settings={...S.settings,...n,availability:av};commit();toast('Ajustes guardados y planificación recalculada')});
function render(){document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===route));$('#main').innerHTML=V[route]()}
const tick=()=>{if(S&&!$('#dlg').open&&route!=='aj')commit()};
const dl=(txt,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
const fresh=()=>({version:storedVer(),subjects:NAMES.map((name,i)=>({id:uid(),name,color:COL[i]})),works:[],blocks:[],settings:DEFAULT_SETTINGS});
function recovery(err){S=null;$('#main').innerHTML=`<h1>Datos no válidos</h1><div class="card warn">${esc(err)}</div><p class=m>No se ha sobrescrito nada: la copia dañada sigue guardada en este navegador. Puedes descargarla, importar una copia JSON válida o empezar de cero (la dañada se conserva aparte).</p><div class=row style="justify-content:flex-start"><button data-a=dlBad>Descargar copia dañada</button><button class=danger data-a=fresh>Empezar de cero</button></div><label>Importar copia JSON<input type=file id=imp accept=".json,application/json"></label>`}
function importText(text){let o;try{o=JSON.parse(text)}catch{toast('El archivo no es un JSON válido.');return'json'}
 const e=validate(o);if(e){toast('Copia no válida: '+e);return e}
 if(!confirm(`Importar copia: ${o.subjects.length} asignaturas, ${o.works.length} tareas/exámenes, ${o.blocks.length} sesiones.\nSe guardará una copia automática de tus datos actuales y después se reemplazarán. ¿Continuar?`))return'cancelado';
 const cur=localStorage.getItem(KEY);if(cur)localStorage.setItem(BAK,cur);
 const {app,schema,exportedAt,...st}=o;st.version=Math.max(S?.version||0,o.version||0,storedVer());S=st;commit();toast('Copia importada');return null}
document.addEventListener('change',async e=>{if(e.target.id==='imp'&&e.target.files[0]){importText(await e.target.files[0].text());e.target.value=''}});
async function boot(){let r;try{r=await repo.load()}catch(e){r={error:e.message}}if(r.error)return recovery(r.error);
 S=r.state||fresh();try{navigator.storage.persist()}catch{}await commit();setInterval(tick,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()})}
boot();

</script></body></html>
